<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵蕴 AssetFlow · 游戏科学研发生产中台</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Microsoft YaHei UI','PingFang SC','Noto Sans CJK SC',sans-serif;font-size:14px;line-height:22px;color:var(--color-text-secondary);background:var(--color-bg-canvas);-webkit-font-smoothing:antialiased}

/* ===== Design Tokens ===== */
:root{
  --color-bg-canvas:#0E0F0F;
  --color-bg-shell:#151716;
  --color-bg-panel:#1C1F1D;
  --color-bg-elevated:#242824;
  --color-border-subtle:#30362F;
  --color-border-strong:#4B544A;
  --color-text-primary:#ECE7DC;
  --color-text-secondary:#B8B0A3;
  --color-text-muted:#81796E;
  --color-text-disabled:#5C5A54;
  --color-text-inverse:#11120F;
  --color-brand-primary:#C9A45B;
  --color-brand-hover:#D8B86F;
  --color-brand-pressed:#A9823D;
  --color-accent-cinnabar:#B94A34;
  --color-accent-jade:#5D8F7B;
  --color-accent-blue:#5B7DAA;
  --status-concept:#8E7CC3; --status-concept-bg:#282338;
  --status-making:#5B7DAA; --status-making-bg:#202A38;
  --status-review:#C9A45B; --status-review-bg:#342C1B;
  --status-revision:#C87941; --status-revision-bg:#352719;
  --status-passed:#6FA477; --status-passed-bg:#1F3024;
  --status-stored:#8EA2A0; --status-stored-bg:#263130;
  --status-blocked:#D65A4A; --status-blocked-bg:#3A211F;
  --status-frozen:#8A8A82; --status-frozen-bg:#2B2C29;
  --sidebar-width:240px; --topbar-height:64px;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:24px; --space-2xl:32px;
  --font-mono:'JetBrains Mono','Consolas','Menlo',monospace;
  --font-en:'Inter','Segoe UI','Arial',sans-serif;
}

/* ===== Layout ===== */
.app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--color-bg-shell);display:flex;flex-direction:column;border-right:1px solid var(--color-border-subtle);z-index:10}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-height);min-height:var(--topbar-height);background:var(--color-bg-shell);border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;padding:0 var(--space-xl);gap:var(--space-lg);z-index:5}
.content{flex:1;overflow-y:auto;padding:var(--space-xl)}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--color-border-subtle);border-radius:3px}
.content::-webkit-scrollbar-thumb:hover{background:var(--color-border-strong)}

/* Global scrollbar for all scrollable panels */
.board-col-body::-webkit-scrollbar,
.review-queue::-webkit-scrollbar,
.revision-panel::-webkit-scrollbar,
.detail-preview::-webkit-scrollbar,
.side-stats::-webkit-scrollbar{width:4px}
.board-col-body::-webkit-scrollbar-track,
.review-queue::-webkit-scrollbar-track,
.revision-panel::-webkit-scrollbar-track,
.detail-preview::-webkit-scrollbar-track,
.side-stats::-webkit-scrollbar-track{background:transparent}
.board-col-body::-webkit-scrollbar-thumb,
.review-queue::-webkit-scrollbar-thumb,
.revision-panel::-webkit-scrollbar-thumb,
.detail-preview::-webkit-scrollbar-thumb,
.side-stats::-webkit-scrollbar-thumb{background:var(--color-border-subtle);border-radius:2px}
.board-col-body::-webkit-scrollbar-thumb:hover,
.review-queue::-webkit-scrollbar-thumb:hover,
.revision-panel::-webkit-scrollbar-thumb:hover{background:var(--color-border-strong)}

/* Selection */
::selection{background:rgba(201,164,91,.25);color:var(--color-text-primary)}
/* Focus ring */
:focus-visible{outline:2px solid var(--color-brand-primary);outline-offset:2px;border-radius:2px}

/* ===== Empty State ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-2xl) var(--space-xl);text-align:center;gap:var(--space-md)}
.empty-state svg{width:48px;height:48px;opacity:.25;stroke:var(--color-text-muted)}
.empty-state .empty-title{font-size:14px;font-weight:500;color:var(--color-text-muted)}
.empty-state .empty-desc{font-size:12px;color:var(--color-text-disabled);max-width:260px}

/* ===== Skeleton ===== */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skeleton{background:linear-gradient(90deg,var(--color-bg-elevated) 25%,var(--color-bg-panel) 37%,var(--color-bg-elevated) 63%);background-size:200px 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--radius-sm)}
.skel-card{height:280px;border-radius:var(--radius-lg)}
.skel-row{height:16px;margin-bottom:var(--space-sm);width:60%}
.skel-row.short{width:38%}

/* ===== Sidebar ===== */
.sidebar-logo{padding:20px var(--space-xl);border-bottom:1px solid var(--color-border-subtle)}
.sidebar-logo h1{font-size:18px;font-weight:600;color:var(--color-brand-primary);letter-spacing:1px}
.sidebar-logo span{font-size:11px;color:var(--color-text-muted);display:block;margin-top:2px}
.sidebar-project{padding:var(--space-md) var(--space-xl);border-bottom:1px solid var(--color-border-subtle)}
.sidebar-project .label{font-size:10px;color:var(--color-text-muted);text-transform:uppercase;margin-bottom:4px}
.sidebar-project .name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.sidebar-nav{flex:1;padding:var(--space-sm) 0}
.sidebar-nav a{display:flex;align-items:center;gap:var(--space-md);padding:0 var(--space-xl);height:44px;color:var(--color-text-secondary);text-decoration:none;font-size:14px;transition:all 0.15s;position:relative}
.sidebar-nav a:hover{background:rgba(255,255,255,0.03);color:var(--color-text-primary)}
.sidebar-nav a.active{color:var(--color-brand-primary);background:rgba(201,164,91,0.08)}
.sidebar-nav a.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--color-brand-primary);border-radius:0 2px 2px 0}
.nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-badge{margin-left:auto;font-size:11px;background:var(--color-accent-cinnabar);color:#fff;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sidebar-user{padding:var(--space-lg) var(--space-xl);border-top:1px solid var(--color-border-subtle);display:flex;align-items:center;gap:var(--space-md)}
.sidebar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--color-brand-primary);color:var(--color-text-inverse);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-family:var(--font-en)}
.sidebar-user .info .name{font-size:13px;color:var(--color-text-primary);font-weight:500}
.sidebar-user .info .role{font-size:11px;color:var(--color-text-muted)}

/* ===== Topbar ===== */
.topbar-project{font-size:15px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:var(--space-sm)}
.topbar-project svg{width:16px;height:16px;stroke:var(--color-text-muted)}
.topbar-search{flex:1;max-width:480px;position:relative}
.topbar-search input{width:100%;height:36px;background:var(--color-bg-panel);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:0 var(--space-lg) 0 38px;color:var(--color-text-primary);font-size:13px;outline:none;transition:border-color 0.15s}
.topbar-search input:focus{border-color:var(--color-border-strong)}
.search-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--color-bg-elevated);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);max-height:300px;overflow-y:auto;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.search-dropdown .sd-item{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);cursor:pointer;border-bottom:1px solid var(--color-border-subtle);font-size:13px;transition:background .1s}
.search-dropdown .sd-item:hover{background:var(--color-bg-panel)}
.search-dropdown .sd-item:last-child{border-bottom:none}
.search-dropdown .sd-type{font-size:10px;padding:2px 6px;border-radius:3px;flex-shrink:0}
.sd-type.asset{background:var(--status-review-bg);color:var(--status-review)}
.sd-type.task{background:var(--status-making-bg);color:var(--status-making)}
.sd-type.spec{background:var(--status-concept-bg);color:var(--status-concept)}
.topbar-search .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);width:16px;height:16px}
.topbar-actions{display:flex;align-items:center;gap:var(--space-md);margin-left:auto}
.topbar-actions .btn-new{height:34px;padding:0 var(--space-lg);background:var(--color-brand-primary);color:var(--color-text-inverse);border:none;border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s}
.topbar-actions .btn-new:hover{background:var(--color-brand-hover)}
.topbar-actions .btn-new svg{width:14px;height:14px;stroke:var(--color-text-inverse)}
.topbar-stat{font-size:12px;color:var(--color-text-muted);display:flex;align-items:center;gap:4px}
.topbar-stat .value{font-size:14px;font-weight:600;color:var(--color-text-primary)}
.topbar-stat.alert .value{color:var(--color-accent-cinnabar)}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:var(--color-brand-primary);color:var(--color-text-inverse);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-family:var(--font-en);cursor:pointer}

/* ===== Page Layouts ===== */
.page{display:none}
.page.active{display:block;animation:pageEnter .25s cubic-bezier(.16,1,.3,1)}
@keyframes pageEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:var(--space-xl)}
.page-title{font-size:24px;font-weight:600;color:var(--color-text-primary);line-height:32px}
.page-subtitle{font-size:13px;color:var(--color-text-muted);margin-top:var(--space-xs)}

/* ===== Stats Row ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-lg);margin-bottom:var(--space-xl)}
.stat-card{background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);padding:var(--space-lg);transition:all .2s cubic-bezier(.16,1,.3,1)}
.stat-card:hover{border-color:var(--color-border-strong);transform:translateY(-1px)}
.stat-card .stat-value{font-size:28px;font-weight:600;color:var(--color-text-primary);line-height:34px;font-family:var(--font-en);transition:transform .15s}
.stat-card:hover .stat-value{transform:scale(1.05)}
.stat-card .stat-label{font-size:12px;color:var(--color-text-muted);margin-top:4px}
.stat-card .stat-sub{font-size:11px;color:var(--color-accent-cinnabar);margin-top:2px}

/* ===== Two Column ===== */
.two-col{display:grid;grid-template-columns:1fr 360px;gap:var(--space-xl)}
.panel{background:var(--color-bg-panel);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.panel-header{padding:var(--space-lg) var(--space-xl);border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:15px;font-weight:600;color:var(--color-text-primary)}
.panel-body{padding:var(--space-lg) var(--space-xl)}

/* ===== Asset Card ===== */
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg)}
.asset-card{background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1)}
.asset-card:hover{border-color:var(--color-border-strong);transform:scale(1.01);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.asset-card .card-thumb{aspect-ratio:16/9;background:radial-gradient(circle at 50% 40%,#1E2220 0%,var(--color-bg-panel) 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.asset-card .card-thumb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px);pointer-events:none}
.asset-card .card-thumb img{width:100%;height:100%;object-fit:cover}
.asset-card .card-thumb .thumb-svg{width:55%;height:55%;opacity:0.6;transition:opacity 0.2s}
.asset-card:hover .card-thumb .thumb-svg{opacity:0.85}
.asset-card .card-thumb .thumb-code{position:absolute;bottom:6px;left:10px;font-size:10px;color:rgba(255,255,255,0.25);font-family:var(--font-mono);pointer-events:none}
.asset-card .card-thumb .risk-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;background:var(--color-accent-cinnabar);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;z-index:2}
.asset-card .card-body{padding:var(--space-md) var(--space-lg)}
.asset-card .card-name{font-size:15px;font-weight:600;color:var(--color-text-primary);margin-bottom:4px}
.asset-card .card-code{font-size:12px;color:var(--color-text-muted);font-family:var(--font-mono);margin-bottom:var(--space-md)}
.asset-card .card-meta{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap}
.asset-card .card-footer{display:flex;align-items:center;justify-content:space-between;padding:var(--space-sm) var(--space-lg);border-top:1px solid var(--color-border-subtle)}
.asset-card .card-footer span{font-size:12px;color:var(--color-text-muted)}

/* ===== Status Badge ===== */
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge.concept{color:var(--status-concept);background:var(--status-concept-bg)} .badge.concept::before{background:var(--status-concept)}
.badge.making,.badge.in-progress{color:var(--status-making);background:var(--status-making-bg)} .badge.making::before,.badge.in-progress::before{background:var(--status-making)}
.badge.review,.badge.pending-review{color:var(--status-review);background:var(--status-review-bg)} .badge.review::before,.badge.pending-review::before{background:var(--status-review)}
.badge.revision{color:var(--status-revision);background:var(--status-revision-bg)} .badge.revision::before{background:var(--status-revision)}
.badge.passed,.badge.completed{color:var(--status-passed);background:var(--status-passed-bg)} .badge.passed::before,.badge.completed::before{background:var(--status-passed)}
.badge.stored{color:var(--status-stored);background:var(--status-stored-bg)} .badge.stored::before{background:var(--status-stored)}
.badge.blocked{color:var(--status-blocked);background:var(--status-blocked-bg)} .badge.blocked::before{background:var(--status-blocked)}
.badge.frozen{color:var(--status-frozen);background:var(--status-frozen-bg)} .badge.frozen::before{background:var(--status-frozen)}

/* risk levels */
.badge.risk-high{color:#D65A4A;background:#3A211F} .badge.risk-high::before{background:#D65A4A}
.badge.risk-mid{color:#C87941;background:#352719} .badge.risk-mid::before{background:#C87941}
.badge.risk-low{color:#8A8A82;background:#2B2C29} .badge.risk-low::before{background:#8A8A82}

/* ===== Filter Tags ===== */
.filter-bar{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-lg);flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:var(--space-sm)}
.filter-group .label{font-size:12px;color:var(--color-text-muted);margin-right:2px}
.filter-tag{height:28px;padding:0 var(--space-md);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);font-size:12px;color:var(--color-text-secondary);background:transparent;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all 0.15s}
.filter-tag:hover{border-color:var(--color-border-strong);color:var(--color-text-primary)}
.filter-tag.active{background:var(--color-brand-primary);border-color:var(--color-brand-primary);color:var(--color-text-inverse);font-weight:500}
.filter-tag .close{margin-left:2px;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px}
.filter-tag.active .close:hover{background:rgba(0,0,0,0.2)}
.filter-search{margin-left:auto}
.filter-search input{height:32px;width:240px;background:var(--color-bg-panel);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:0 var(--space-md) 0 32px;color:var(--color-text-primary);font-size:12px;outline:none}
.filter-search input:focus{border-color:var(--color-border-strong)}
.filter-search{position:relative}
.filter-search .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);font-size:14px}

/* ===== Side Stats Panel ===== */
.side-stats{display:flex;flex-direction:column;gap:var(--space-lg)}
.stat-mini-card{background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);padding:var(--space-lg)}
.stat-mini-card .value{font-size:28px;font-weight:600;color:var(--color-text-primary);font-family:var(--font-en)}
.stat-mini-card .label{font-size:12px;color:var(--color-text-muted);margin-top:4px}

/* ===== Tables ===== */
.data-table{width:100%;border-collapse:collapse}
.data-table th,.data-table td{padding:var(--space-md) var(--space-lg);text-align:left;font-size:13px}
.data-table th{font-size:11px;font-weight:500;color:var(--color-text-muted);text-transform:uppercase;background:var(--color-bg-panel);border-bottom:1px solid var(--color-border-subtle)}
.data-table td{color:var(--color-text-secondary);border-bottom:1px solid var(--color-border-subtle)}
.data-table tr{cursor:pointer;transition:background 0.1s}
.data-table tbody tr:hover{background:rgba(255,255,255,0.02)}
.data-table .asset-link{color:var(--color-brand-primary);font-weight:500;cursor:pointer}
.data-table .asset-link:hover{text-decoration:underline}
.data-table .code{font-family:var(--font-mono);font-size:12px;color:var(--color-text-muted)}
.ver-expand{display:inline-block;width:14px;font-size:10px;transition:transform .15s;color:var(--color-text-muted)}
.ver-row.expanded .ver-expand{transform:rotate(90deg)}
.ver-row:hover{background:var(--color-bg-elevated)}

/* ===== Task Board ===== */
.board{display:flex;gap:var(--space-lg);overflow-x:auto;min-height:calc(100vh - 200px)}
.board-column{flex:1;min-width:220px;max-width:280px;display:flex;flex-direction:column}
.board-col-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);margin-bottom:var(--space-sm);border-radius:var(--radius-md)}
.board-col-header.h-notstarted{background:rgba(138,138,130,0.1)}
.board-col-header.h-inprogress{background:rgba(91,125,170,0.1)}
.board-col-header.h-blocked{background:rgba(214,90,74,0.1)}
.board-col-header.h-pendingreview{background:rgba(201,164,91,0.1)}
.board-col-header.h-completed{background:rgba(111,164,119,0.1)}
.board-col-title{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.board-col-count{font-size:12px;color:var(--color-text-muted)}
.board-col-body{flex:1;overflow-y:auto;padding:0 var(--space-sm);display:flex;flex-direction:column;gap:var(--space-sm);min-height:60px;transition:background 0.15s}
.board-col-body.drag-over{background:rgba(201,164,91,0.08);border-radius:var(--radius-md)}

/* Task Card */
.task-card{background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:var(--space-md);cursor:grab;transition:all .15s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.task-card:hover{border-color:var(--color-border-strong);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.5;border:2px dashed var(--color-brand-primary);box-shadow:0 8px 24px rgba(0,0,0,.3);transform:rotate(1deg) scale(1.03)}
.task-check{position:absolute;top:10px;right:10px;width:18px;height:18px;cursor:pointer;z-index:5;opacity:.5;transition:all .15s}
.task-check:hover{opacity:1}
.task-card.task-done .task-title{text-decoration:line-through;opacity:.45}
.task-card.task-done{opacity:.65}
.line-through{text-decoration:line-through;opacity:.45}
.task-card .task-priority{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px}
.task-card .task-priority.p0{background:#D65A4A}
.task-card .task-priority.p1{background:#C87941}
.task-card .task-priority.p2{background:#5B7DAA}
.task-card .task-priority.p3{background:#8A8A82}

.detail-layout{display:grid;grid-template-columns:1fr 320px 340px;gap:var(--space-xl);min-height:calc(100vh - 180px)}

.detail-actions button{height:36px;padding:0 var(--space-lg);border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s}

.btn-secondary:active{transform:scale(.97)}
.btn-danger{background:transparent;border:1px solid var(--color-accent-cinnabar);color:var(--color-accent-cinnabar);transition:all .15s}

.btn-danger:active{transform:scale(.97)}
.info-table{width:100%}
.info-table td{padding:var(--space-sm) 0;font-size:13px}
.info-table td:first-child{color:var(--color-text-muted);width:80px}
.info-table td:last-child{color:var(--color-text-primary);font-weight:500}
.section-title{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:var(--space-sm);padding-bottom:var(--space-sm);border-bottom:1px solid var(--color-border-subtle)}

/* ===== Timeline ===== */
.timeline{display:flex;flex-direction:column;gap:0}
.timeline-item{position:relative;padding-left:28px;padding-bottom:var(--space-lg)}
.timeline-item::before{content:'';position:absolute;left:8px;top:14px;bottom:-12px;width:2px;background:var(--color-border-subtle)}
.timeline-item:last-child::before{display:none}
.timeline-dot{position:absolute;left:4px;top:8px;width:10px;height:10px;border-radius:50%;border:2px solid var(--color-text-muted)}

.timeline-content.blue-box{border-color:var(--color-accent-blue)}

.timeline-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.timeline-author{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.timeline-time{font-size:11px;color:var(--color-text-muted)}
.timeline-text{font-size:13px;color:var(--color-text-secondary);line-height:20px}

/* ===== Review Center ===== */
.review-layout{display:grid;grid-template-columns:280px 1fr 300px;gap:var(--space-xl);min-height:calc(100vh - 180px)}
.review-queue{background:var(--color-bg-panel);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.queue-item{padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background 0.15s}
.queue-item:hover{background:rgba(255,255,255,0.02)}
.queue-item.active{background:rgba(201,164,91,0.08);border-left:3px solid var(--color-brand-primary)}
.queue-item .q-name{font-size:13px;font-weight:600;color:var(--color-text-primary)}

.review-main{display:flex;flex-direction:column;gap:var(--space-lg)}
.review-preview{background:radial-gradient(circle at 50% 40%,#1E2220 0%,var(--color-bg-panel) 100%);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);min-height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.review-preview::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px);pointer-events:none}

.revision-panel{display:flex;flex-direction:column;gap:var(--space-md)}

.bar-fill.role{background:var(--status-review)}
.bar-fill.scene{background:var(--status-making)}

.toast-container{position:fixed;top:var(--topbar-height);right:var(--space-xl);z-index:100;display:flex;flex-direction:column;gap:var(--space-sm)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.15s}
.modal{background:var(--color-bg-panel);border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);width:480px;max-width:90vw;box-shadow:0 16px 48px rgba(0,0,0,0.4)}

.modal-body .form-group{margin-bottom:var(--space-lg)}
.modal-body label{display:block;font-size:12px;color:var(--color-text-muted);margin-bottom:6px}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;height:36px;background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:0 var(--space-md);color:var(--color-text-primary);font-size:13px;outline:none;font-family:inherit}

.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{border-color:var(--color-border-strong)}
.modal-footer{padding:var(--space-lg) var(--space-xl);border-top:1px solid var(--color-border-subtle);display:flex;justify-content:flex-end;gap:var(--space-sm)}
.modal-footer button{height:36px;padding:0 var(--space-xl);border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== Dashboard specific ===== */
.dash-layout{display:grid;grid-template-columns:1fr 360px;gap:var(--space-xl)}
.asset-row{display:flex;gap:var(--space-lg);margin-bottom:var(--space-lg);overflow-x:auto}

.task-list-item{display:flex;align-items:center;padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background 0.15s;gap:var(--space-md)}

.task-list-item .task-info .t-asset{font-size:11px;color:var(--color-text-muted);margin-top:2px}
.pending-section{margin-bottom:var(--space-lg)}
.pending-section .ps-title{font-size:11px;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;margin-bottom:var(--space-sm);padding:0 var(--space-lg)}
.pending-item{padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--color-border-subtle)}
.pending-item:last-child{border-bottom:none}
.pending-item .pi-name{font-size:13px;color:var(--color-text-primary);font-weight:500}
.pending-item .pi-desc{font-size:11px;color:var(--color-text-muted);margin-top:2px}

/* ===== Spec Tag ===== */
.spec-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;border:1px solid}

}

// ==================== ROUTER ====================
function getRoute(){return window.location.hash.slice(1)||'/dashboard'}
function navigate(route){window.location.hash=route}

function parseRoute(route){
  if(route.startsWith('/asset/'))return{page:'asset-detail',id:route.split('/')[2]};
  const pages={dashboard:true,assets:true,tasks:true,reviews:true,specs:true,risks:true};
  const p=route.replace('/','');
  return{page:pages[p]?p:'dashboard'};
}

function updateNav(page){
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active'));
  const link=document.querySelector(`[data-route="${page==='asset-detail'?'assets':page}"]`);
  if(link)link.classList.add('active');
}

// ==================== COMPONENT FACTORIES ====================
function statusBadge(stage){const cls=STAGE_BADGE_MAP[stage]||'making';return`<span class="badge ${cls}">${stage}</span>`}
function taskStatusBadge(status){const cls=TASK_STATUS_MAP[status]||'in-progress';return`<span class="badge ${cls}">${status}</span>`}
function riskBadge(level){const map={high:'risk-high',mid:'risk-mid',low:'risk-low'};const label={high:'高',mid:'中',low:'低'};return`<span class="badge ${map[level]}">${label[level]}风险</span>`}

function assetCard(asset){
  const risk=asset.risk==='high'?`<div class="risk-badge">!</div>`:'';
  return `
  <div class="asset-card" data-asset-id="${asset.id}" onclick="navigate('/asset/${asset.id}')">
    <div class="card-thumb">
      ${assetThumbHTML(asset.type,asset.code)}
      ${risk}
    </div>
    <div class="card-body">
      <div class="card-name">${asset.name} · ${asset.type}</div>
      <div class="card-code">${asset.code}</div>
      <div class="card-meta">${statusBadge(asset.stage)}</div>
    </div>
    <div class="card-footer">
      <span>${asset.version}</span>
      <span>${asset.revisionCount>0?asset.revisionCount+'次返修 · ':''}${asset.owner}</span>
    </div>
  </div>`;
}

function taskCard(task){
  const isBlocked=task.status==='阻塞';
  const checked=task._done||false;
  return `
  <div class="task-card${isBlocked?' blocked-card':''}${checked?' task-done':''}" draggable="true" data-task-id="${task.id}" 
       ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)">
    <div class="task-priority ${task.priority.toLowerCase()}"></div>
    <div class="task-check" onclick="event.stopPropagation();toggleTaskDone('${task.id}')">
      ${checked?'<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="#5D8F7B" stroke="#5D8F7B"/><path d="M5 8.5l2 2 4-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':
      '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#4B544A" stroke-width="1.2"/></svg>'}
    </div>
    <div class="task-title ${checked?'line-through':''}">${task.title}</div>
    <div class="task-asset">关联：${task.assetName}</div>
    <div class="task-meta">
      ${taskStatusBadge(task.status)}
      ${task.blockReason?`<span style="font-size:11px;color:var(--color-accent-cinnabar)">${task.blockReason}</span>`:''}
    </div>
  </div>`;
}

// ==================== DRAG & DROP ====================
var NEXT_STATUS_MAP = {'notstarted':'未开始','in-progress':'进行中','blocked':'阻塞','pending-review':'待评审','completed':'已完成'};

function toggleTaskDone(taskId){
  const task=TASKS.find(t=>t.id===taskId);
  if(task){task._done=!task._done;}
  renderPage();
}
function handleDragStart(e){
  e.dataTransfer.setData('text/plain',e.target.dataset.taskId);
  e.target.classList.add('dragging');
}
function handleDragEnd(e){e.target.classList.remove('dragging')}
function handleDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function handleDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  const taskId=e.dataTransfer.getData('text/plain');
  const newStatus=NEXT_STATUS_MAP[e.currentTarget.dataset.status];
  const task=TASKS.find(t=>t.id===taskId);
  if(!task)return;
  if(task.status==='阻塞'&&newStatus==='已完成'){toast('阻塞任务需先解除阻塞才能完成','error');return}
  if(task.status===newStatus)return;
  task.status=newStatus;toast(`任务「${task.title}」已移至「${newStatus}」`,'success');
  renderPage();
}

// ==================== TOAST ====================
function toast(msg,type=''){
  const container=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className=`toast ${type}`;el.textContent=msg;
  container.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='all 0.2s';setTimeout(()=>el.remove(),200)},2500);
}

function showModal(title,body,footer,cls=''){
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal ${cls}">
    <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">${footer}</div>
  </div>`;
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
}

// ==================== FILTERS ====================
function toggleFilter(el){
  const group=el.dataset.filter;
  const val=el.dataset.value;
  if(val==='all'){
    el.parentElement.querySelectorAll('.filter-tag').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
  }else{
    el.parentElement.querySelector('.filter-tag[data-value="all"]').classList.remove('active');
    el.classList.toggle('active');
    const anyActive=[...el.parentElement.querySelectorAll('.filter-tag:not([data-value="all"])')].some(t=>t.classList.contains('active'));
    if(!anyActive)el.parentElement.querySelector('.filter-tag[data-value="all"]').classList.add('active');
  }
  renderPage();
}

function toggleSpecTab(el){
  document.querySelectorAll('.spec-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderPage();
}

function selectReview(reviewId){
  currentReviewId=reviewId;
  renderPage();
}

// ==================== MAIN RENDER ====================
function renderPage(){
  const route=getRoute();
  const {page,id}=parseRoute(route);
  updateNav(page);
  const content=document.getElementById('pageContent');

  let html='';
  switch(page){
    case 'assets':html=renderAssets();break;
    case 'asset-detail':html=renderAssetDetail(id);break;
    case 'tasks':html=renderTasks();break;
    case 'reviews':html=renderReviews();break;
    case 'specs':html=renderSpecs();break;
    case 'risks':html=renderRisks();break;
    default:html=renderDashboard();
  }
  content.innerHTML=html;

  // Re-attach event listeners for search inputs
  const assetSearch=document.getElementById('assetSearch');
  if(assetSearch){
    assetSearch.addEventListener('input',applyAssetFilter);
  }
  const specSearch=document.getElementById('specSearch');
  if(specSearch){
    specSearch.addEventListener('input',applySpecFilter);
  }

  // Apply existing filters
  if(page==='assets')applyAssetFilter();
  if(page==='specs')applySpecFilter();
}

function applyAssetFilter(){
  const activeTypes=getActiveFilters('type');
  const activeStatuses=getActiveFilters('status');
  const searchTerm=(document.getElementById('assetSearch')?.value||'').toLowerCase();

  const grid=document.getElementById('assetGrid');
  if(!grid)return;
  const cards=grid.querySelectorAll('.asset-card');
  const existingEmpty=grid.parentElement.querySelector('.empty-state');
  if(existingEmpty)existingEmpty.remove();

  let visibleCount=0;
  ASSETS.forEach((asset,i)=>{
    const card=cards[i];if(!card)return;
    let match=true;
    if(activeTypes.length>0&&!matchTypeFilter(asset.type,activeTypes))match=false;
    if(activeStatuses.length>0&&!activeStatuses.includes(asset.stage))match=false;
    if(searchTerm&&!asset.name.toLowerCase().includes(searchTerm)&&!asset.code.toLowerCase().includes(searchTerm))match=false;
    card.style.display=match?'':'none';
    if(match)visibleCount++;
  });

  if(visibleCount===0){
    grid.insertAdjacentHTML('afterend',emptyState('没有找到匹配的资产','试试调整筛选条件或搜索关键词'));
  }
}

function applySpecFilter(){
  const activeCat=document.querySelector('.spec-tab.active')?.dataset.specCat||'all';
  const searchTerm=(document.getElementById('specSearch')?.value||'').toLowerCase();
  const list=document.getElementById('specList');
  if(!list)return;
  const cards=list.querySelectorAll('.spec-card');
  const existingEmpty=list.parentElement.querySelector('.empty-state');
  if(existingEmpty)existingEmpty.remove();

  let visibleCount=0;
  SPECS.forEach((spec,i)=>{
    const card=cards[i];if(!card)return;
    let match=true;
    if(activeCat!=='all'&&spec.category!==activeCat)match=false;
    if(searchTerm&&!spec.title.toLowerCase().includes(searchTerm)&&!spec.summary.toLowerCase().includes(searchTerm))match=false;
    card.style.display=match?'':'none';
    if(match)visibleCount++;
  });

  if(visibleCount===0){
    list.insertAdjacentHTML('afterend',emptyState('没有找到匹配的规范','试试切换分类或调整搜索关键词'));
  }
}

function getActiveFilters(group){
  const tags=document.querySelectorAll(`.filter-tag[data-filter="${group}"].active`);
  return [...tags].map(t=>t.dataset.value).filter(v=>v!=='all');
}

// Category mappings for broad type filtering
const TYPE_CATEGORIES = {
  '角色怪物':['角色','怪物'],
  '场景道具关卡':['场景','道具','关卡'],
  '特效音频':['特效','音频'],
  '动画镜头':['动画','镜头'],
  'UI蓝图材质':['UI','蓝图','材质'],
};

function matchTypeFilter(assetType, activeCatValues){
  if(activeCatValues.length===0)return true;
  return activeCatValues.some(cat=>{
    const types=TYPE_CATEGORIES[cat]||[cat];
    return types.includes(assetType);
  });
}

// ==================== INIT ====================
window.addEventListener('hashchange',renderPage);
document.getElementById('btnNewAsset').addEventListener('click',()=>toast('新建资产功能将在后续版本中实装'));

let searchDropdown=document.getElementById('searchDropdown');
document.getElementById('globalSearch').addEventListener('input',function(e){
  const val=e.target.value.toLowerCase().trim();
  if(!val){searchDropdown.style.display='none';return;}
  
  const results=[];
  ASSETS.forEach(a=>{if(a.name.toLowerCase().includes(val)||a.code.toLowerCase().includes(val))results.push({type:'asset',text:`${a.name} · ${a.type}`,sub:`${a.code} ${a.version}`,id:a.id,url:`/asset/${a.id}`});});
  TASKS.forEach(t=>{if(t.title.toLowerCase().includes(val))results.push({type:'task',text:t.title,sub:t.assetName,id:t.id,url:`/tasks`});});
  SPECS.forEach(s=>{if(s.title.toLowerCase().includes(val))results.push({type:'spec',text:s.title,sub:s.summary,id:s.id,url:`/specs`});});
  
  if(results.length===0){searchDropdown.style.display='none';return;}
  
  searchDropdown.innerHTML=results.slice(0,8).map(r=>`
    <div class="sd-item" onclick="navigate('${r.url}');document.getElementById('globalSearch').value='';searchDropdown.style.display='none'">
      <span class="sd-type ${r.type}">${r.type==='asset'?'资产':r.type==='task'?'任务':'规范'}</span>
      <span style="flex:1">${r.text}</span>
      <span style="font-size:11px;color:var(--color-text-muted)">${r.sub}</span>
    </div>
  `).join('');
  searchDropdown.style.display='block';
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.topbar-search'))searchDropdown.style.display='none';
});

renderPage();
</script>
